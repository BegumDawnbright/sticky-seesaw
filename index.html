<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sticky Seesaw</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1d1b2e;font-family:'Trebuchet MS',Arial,sans-serif;color:#fff;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px}
h1{font-size:clamp(34px,10vw,58px);font-weight:900;letter-spacing:-1px;text-align:center;line-height:.95;text-shadow:0 4px 0 #0006}
p{opacity:.7;font-size:14px;font-weight:bold;letter-spacing:.1em}
.list{display:flex;flex-direction:column;gap:14px;width:min(360px,100%)}
a{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;text-decoration:none;font-weight:900;font-size:22px;border:3px solid #fff6;box-shadow:0 6px 0 #0005;transition:transform .1s}
a:active{transform:translateY(4px);box-shadow:0 2px 0 #0005}
a small{display:block;font-size:12px;font-weight:bold;opacity:.75;margin-top:2px}
.ic{width:46px;height:46px;border-radius:12px;flex:none;box-shadow:inset 0 -4px 0 #0003}
.classic{background:linear-gradient(#5b6bd8,#3e4bb0);color:#fff}
.classic .ic{background:conic-gradient(#ff5d5d 0 25%,#ffd34d 0 50%,#4dd17a 0 75%,#4da6ff 0)}
.soap{background:linear-gradient(#bdf0f5,#7fd3dd);color:#2f6a78}
.soap .ic{background:linear-gradient(#b2e8d3,#8dc5b7);border-radius:16px}
.candy{background:linear-gradient(#ffc2d9,#f58fb8);color:#7a2f4e}
.candy .ic{background:repeating-linear-gradient(45deg,#fff 0 7px,#ff5c8d 7px 14px);border-radius:50%}
</style>
</head>
<body>
<h1>STICKY<br>SEESAW</h1>
<p>TEMA SEÇ</p>
<div class="list">
  <a class="classic" href="classic.html"><span class="ic"></span><span>Klasik<small>Bloklar</small></span></a>
  <a class="soap" href="soap.html"><span class="ic"></span><span>Soap Stack<small>Sabunlar</small></span></a>
  <a class="candy" href="candy.html"><span class="ic"></span><span>Sticky Sweets<small>Şekerler</small></span></a>
</div>
</body>
</html>
